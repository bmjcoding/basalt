name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces: minutes are the constraint (they ran out once).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Tokens, components and browser tests
    runs-on: ubuntu-24.04
    # A hung browser test stops here, not at the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install the Chromium that the pinned Playwright expects
        run: npx --workspace packages/react playwright install --with-deps chromium
      - run: npm test
      - run: npm run artifact
      - run: npm run typecheck:review
      - run: npm run test:packages
      - name: Generated Swift is up to date
        run: git diff --exit-code -- Sources/BasaltTokens/Tokens.swift

  apple:
    name: Swift package (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift test
        env:
          BASALT_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
      - name: Upload the SwiftUI renders for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swiftui-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      # The renders also go into the log, base64 in 76-column lines between markers, for
      # environments that can read job logs but not artifact storage.
      - name: Print the SwiftUI renders into the log
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/snapshots/*.png; do
            [ -f "$f" ] || continue
            echo "BASALT-SNAPSHOT-BEGIN $(basename "$f")"
            base64 -b 76 -i "$f"
            echo "BASALT-SNAPSHOT-END"
          done
