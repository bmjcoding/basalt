<main class="page stack">

    <div class="command-list" data-label="Console"><script type="application/json" data-commands>{"groups": [{"label": "Sandbox", "items": [{"id": "new", "label": "New sandbox", "icon": "TerminalWindow", "description": "Create a fresh environment", "keys": ["⌘", "N"], "href": "#new"}, {"id": "dup", "label": "Duplicate", "icon": "Download", "description": "Copy the current one", "href": "#dup"}, {"id": "rename", "label": "Rename", "href": "#rename"}, {"id": "del", "label": "Delete sandbox", "icon": "Trash", "danger": true, "description": "Remove it for good", "href": "#del"}]}, {"label": "Account", "items": [{"id": "profile", "label": "Profile", "href": "#profile"}, {"id": "keys", "label": "API keys", "description": "A description that is far too long for one line of this list, so it has to be cut with an ellipsis and never wrap", "keys": ["⌘", "J"], "href": "#keys"}, {"id": "billing", "label": "Billing", "description": "Plans and invoices", "href": "#billing"}, {"id": "team", "label": "Team", "href": "#team"}]}]}</script></div>

<template data-detail="new"><div><h3>New sandbox</h3><p>Create a fresh environment</p><div><button class="btn" type="button">Run New sandbox</button></div></div></template>

<template data-detail="billing"><div><h3>Billing</h3><p>Plans and invoices</p><div><button class="btn" type="button">Run Billing</button></div></div></template>
<template data-detail="team"><div><h3>Team</h3><p>No description</p><div><button class="btn" type="button">Run Team</button></div></div></template></div>
