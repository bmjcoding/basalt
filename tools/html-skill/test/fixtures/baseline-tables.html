    <tr><td class="select-col"><input type="checkbox" aria-label="Select build-0139"></td><th scope="row">build-0139</th><td data-value="queued"><span class="status" data-status="neutral">Queued</span></td><td data-numeric data-value="386">6m 26s</td><td data-value="cedar">Cedar</td></tr>

    <tr><td class="select-col"><input type="checkbox" aria-label="Select build-0136"></td><th scope="row">build-0136</th><td data-value="failed"><span class="status" data-status="danger">Failed</span></td><td data-numeric data-value="105">1m 45s</td><td data-value="fir">Fir</td></tr>
    <tr><td class="select-col"><input type="checkbox" aria-label="Select build-0135"></td><th scope="row">build-0135</th><td data-value="failed"><span class="status" data-status="danger">Failed</span></td><td data-numeric data-value="278">4m 38s</td><td data-value="gingko">Gingko</td></tr>
