      <div class="cluster">
        <label class="choice"><input type="checkbox" checked> Checked</label>
        <label class="choice"><input type="checkbox" disabled checked> Disabled on</label>
        <label class="choice"><input type="checkbox"> Unchecked</label>
        <label class="choice"><input type="checkbox" disabled> Disabled</label>
